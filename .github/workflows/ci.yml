name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: localpager-agent/package-lock.json

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - run: go install github.com/dutifuldev/slophammer/go/cmd/slophammer-go@v0.1.9
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: go vet ./...
        working-directory: reposhell
      - run: go test ./...
      - run: go test ./...
        working-directory: reposhell
      - run: ./scripts/check-go-quality.sh
      - run: slophammer-go dry . --max-candidates 0
      - run: slophammer-go crap .
      - run: slophammer-go mutate . --scan
      - run: golangci-lint run
        working-directory: reposhell
      - run: npm ci --prefix localpager-agent
      - run: npm --prefix localpager-agent run check
      - run: slophammer-go check . --execute
