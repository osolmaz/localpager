go:
  coverage_threshold: 85
  targets:
    - .
  exclude:
    - "**/*_test.go"
  dry:
    max_findings: 0
    paths:
      - .
    exclude:
      - "**/*_test.go"
    structural:
      enabled: true
      threshold: 0.82
      min_lines: 4
      min_nodes: 20
    copied_blocks:
      enabled: true
      min_tokens: 100
  crap_max_score: 8
  mutation:
    targets:
      - .
  dependency_boundaries:
    - from: cmd
      allow:
        - reposhellcli
    - from: reposhellcli
      allow:
        - .
