go:
  coverage_threshold: 85
  targets:
    - internal/config
    - internal/sources/kind.go
    - internal/sources/stats.go
  exclude:
    - "**/*_test.go"
    - "localpager-agent/**"
    - "examples/**"
    - "bin/**"
  dry:
    max_findings: 0
    paths:
      - cmd
      - internal
    exclude:
      - "**/*_test.go"
      - "localpager-agent/**"
      - "examples/**"
    structural:
      enabled: true
      threshold: 0.82
      min_lines: 4
      min_nodes: 20
    copied_blocks:
      enabled: true
      min_tokens: 100
  crap_max_score: 8
  mutation:
    targets:
      - internal/config
      - internal/localpager
      - internal/sources/github
  dependency_boundaries:
    - from: cmd
      allow:
        - internal/app
        - internal/cli
        - internal/config
        - internal/localpager
        - internal/reposhell
        - internal/reposhellcli
        - internal/sources
        - internal/timing
    - from: internal/app
      allow:
        - internal/config
        - internal/localpager
        - internal/reposhell
        - internal/sources
    - from: internal/cli
      allow:
        - internal/config
        - internal/localpager
    - from: internal/config
      allow: []
    - from: internal/localpager
      allow:
        - internal/timing
    - from: internal/reposhell
      allow: []
    - from: internal/reposhellcli
      allow:
        - internal/config
        - internal/reposhell
    - from: internal/sources
      allow:
        - internal/localpager
        - internal/sources
