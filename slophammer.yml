go:
  coverage:
    threshold: 85
  targets:
    - internal/config
    - internal/sources/kind.go
    - internal/sources/stats.go
  exclude:
    - "**/*_test.go"
    - pattern: "localpager-agent/**"
      reason: separate agent module with its own build and test workflow
    - pattern: "reposhell/**"
      reason: separate nested Go module with its own Slophammer configuration
    - pattern: "examples/**"
      reason: sample programs are documentation fixtures rather than shipped production code
    - pattern: "bin/**"
      reason: generated local command artifacts contain no maintained source
  dry:
    max_findings: 0
    paths:
      - cmd
      - internal
    exclude:
      - "**/*_test.go"
      - pattern: "localpager-agent/**"
        reason: separate agent module with its own build and test workflow
      - pattern: "examples/**"
        reason: sample programs are documentation fixtures rather than shipped production code
    structural:
      enabled: true
      threshold: 0.82
      min_lines: 4
      min_nodes: 20
    copied_blocks:
      enabled: true
      min_tokens: 100
  crap:
    max_score: 8
  mutation:
    targets:
      - internal/config/config.go
      - internal/localpager/policy.go
      - internal/sources/kind.go
  dependency_boundaries:
    - from: cmd
      allow:
        - internal/app
        - internal/cli
        - internal/config
        - internal/localpager
        - internal/sources
        - internal/timing
        - reposhell/reposhellcli
    - from: internal/app
      allow:
        - internal/config
        - internal/localpager
        - internal/sources
    - from: internal/cli
      allow:
        - internal/config
        - internal/localpager
    - from: internal/config
      allow: []
    - from: internal/localpager
      allow:
        - internal/timing
    - from: internal/sources
      allow:
        - internal/localpager
        - internal/sources
    - from: reposhell/cmd
      allow:
        - reposhell/reposhellcli
    - from: reposhell/reposhellcli
      allow:
        - reposhell
